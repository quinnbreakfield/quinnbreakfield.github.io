<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Quinn · {{ page.title }}</title>

        {% if page.noindex %}
            <meta name="robots" content="noindex">
        {% else %}
            <link rel="canonical" href="{{ page.url | absolute_url }}">
        {% endif %}
        <meta name="description" content="{{ page.description }}">
        <meta property="og:description" content="{{ page.description }}"/>
        <meta property="og:title" content="Quinn · {{ page.title }}"/>
        <meta property="og:url" content="{{ page.url | absolute_url }}">
        <meta property="og:image" content="{{ '/resources/thumbnail.png' | absolute_url }}"/>
        <meta property="og:image:alt" content="Quinn's Portfolio">
        <meta property="og:image:width" content="1200"/>
        <meta property="og:image:height" content="630"/>
        <meta property="og:type" content="website"/>

        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:image" content="{{ '/resources/thumbnail.png' | absolute_url }}">
        <meta name="twitter:image:alt" content="Quinn's Portfolio">

        <link rel="icon" type="image/x-icon" href="{{ '/resources/favicon.ico' | relative_url }}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono&family=Chivo:wght@300..500&family=Noto+Sans:wght@360..400&family=Noto+Serif:ital,wght@1,360&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="{{ '/styles/styles.css' | relative_url }}">
        {% if jekyll.environment == "development" %}
            <script src="{{ '/scripts/scripts.js' | relative_url }}" defer></script>
        {% endif %}
        {% if page.extra_scripts contains "emailjs" %}
            <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5.0.3/dist/email.min.js" integrity="sha384-fVBN3OfGKDU4lDZsc0RssV/ZK08AXvHqin023KUTrDojbrGtReubBIdEZJdqx8D+" crossorigin="anonymous" defer></script>
        {% endif %}
        {% if page.extra_scripts contains "contact" %}
            <script src="{{ '/scripts/contact.js' | relative_url }}" type="module"></script>
        {% endif %}
    </head>
    <body>

        <!-- Navigation bar -->
        {% include navigation.html %}

        <!-- Main content -->
        <main>{{ content }}</main>

        <!-- Footer -->
        {% include footer.html %}

    </body>
</html>
